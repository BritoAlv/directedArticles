[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-articles-site"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mkdocs-material",
    "mkdocs-jupyter",
    "pathspec",
    "pygments",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-table-reader-plugin>=3.1.0",
    "pillow>=12.3.0",
    "cairosvg>=2.9.0",
]

[project.entry-points."mkdocs.plugins"]
gitignore = "site_tools.gitignore_plugin:GitignorePlugin"
mathblock = "site_tools.mathblock_plugin:MathBlockPlugin"
assets = "site_tools.assets_plugin:AssetsPlugin"
filebrowser = "site_tools.filebrowser_plugin:FileBrowserPlugin"
codeview = "site_tools.codeview_plugin:CodeViewPlugin"
filetree = "site_tools.filetree_plugin:FileTreePlugin"

[tool.uv]
package = true

[tool.setuptools]
packages = ["site_tools"]
