[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-articles-site"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pathspec",
    "pillow",
    "pyyaml",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["site_tools"]
